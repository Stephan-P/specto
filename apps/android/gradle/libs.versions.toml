[versions]
# Keep AGP at or below what the installed Android Studio supports.
agp = "9.2.1"
# AGP's built-in Kotlin is bumped to this by the Compose compiler plugin.
kotlin = "2.3.21"
compose-bom = "2026.04.01"
activity-compose = "1.12.4"
core = "1.16.0"
jna = "5.19.1"
junit = "4.13.2"
json = "20260814"
androidx-test-core = "1.7.0"
androidx-test-runner = "1.7.0"
androidx-test-junit = "1.3.0"
espresso = "3.7.0"
ktlint = "1.8.0"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-core" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
# FileProvider, for sharing a copy of a document.
androidx-core = { module = "androidx.core:core", version.ref = "core" }
# UniFFI's Kotlin bindings call into Rust through JNA.
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }

compose-ui-test = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
# Compose's test library brings an Espresso too old for current Android
# versions (its input injection fails on Android 14 and later).
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
junit = { module = "junit:junit", version.ref = "junit" }
# Unit tests run on the JVM, where Android's own org.json is only a stub.
json = { module = "org.json:json", version.ref = "json" }
# The formatter and style check for the Kotlin code: see `ktlintCheck` in build.gradle.kts.
ktlint = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
