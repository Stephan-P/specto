# More memory than Gradle's default, which the Android build outgrows.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Reuses the result of the configuration phase between builds.
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official

# ABIs to build the Rust library for. arm64-v8a covers real devices and the
# emulator on Apple Silicon. Add x86_64 for emulators on Intel or AMD hosts
# (needs `rustup target add x86_64-linux-android`).
specto.abis=arm64-v8a
