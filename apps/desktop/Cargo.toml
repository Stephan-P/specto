[package]
name = "pdfrs-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "pdfrs desktop app (GTK4 + libadwaita)"

[[bin]]
name = "pdfrs-gtk"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
async-channel = "2"
pdfrs-geom.workspace = true
pdfrs-render.workspace = true
pdfrs-source.workspace = true
pdfrs-text.workspace = true
pdfrs-view.workspace = true

[lints]
workspace = true
