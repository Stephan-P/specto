name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    # Same distro as development, so GTK/libadwaita versions match.
    container: fedora:44
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y git
      - uses: actions/checkout@v4
      - run: ci/install-deps-fedora.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # The FFI crate's JNI code only compiles for Android.
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Clippy (Android FFI)
        # Check only, so no NDK is needed.
        run: cargo clippy -p pdfrs-ffi --all-targets --target aarch64-linux-android
      - name: Test
        run: cargo test --workspace

  android:
    # Builds the Android app (which cross-compiles the Rust library and
    # generates its Kotlin bindings) and runs the Kotlin unit tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install the NDK
        # Must match `ndkVersion` in apps/android/app/build.gradle.kts. The
        # runner image ships the Android SDK; Gradle fetches the platform and
        # build tools itself once the licences are accepted.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit tests
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest
