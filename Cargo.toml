[workspace]
resolver = "3"
members = ["crates/*", "tools/*", "spikes/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92" # hayro 0.9 requires 1.92
license = "MIT OR Apache-2.0"

[workspace.dependencies]
pdfrs-geom = { path = "crates/pdfrs-geom" }
pdfrs-render = { path = "crates/pdfrs-render" }
pdfrs-view = { path = "crates/pdfrs-view" }
hayro = "0.9"
anyhow = "1"
thiserror = "2"
uniffi = "0.32"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
wait-timeout = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2 # rendering deps are painfully slow unoptimized
