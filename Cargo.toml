[workspace]
resolver = "3"
members = ["crates/*", "tools/*", "spikes/*", "apps/desktop"]
exclude = ["tools/headless"] # shell scripts, not a crate

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92" # hayro 0.9 requires 1.92
license = "MIT OR Apache-2.0"

[workspace.dependencies]
specto-geom = { path = "crates/specto-geom" }
specto-source = { path = "crates/specto-source" }
specto-render = { path = "crates/specto-render" }
specto-view = { path = "crates/specto-view" }
specto-text = { path = "crates/specto-text" }
specto-doc = { path = "crates/specto-doc" }
specto-session = { path = "crates/specto-session" }
specto-write = { path = "crates/specto-write" }
hayro = "0.9"
anyhow = "1"
thiserror = "2"
uniffi = "0.32"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
wait-timeout = "0.2"
libc = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2 # rendering deps are painfully slow unoptimized
